project:
  name: groundwater-ml-karnataka
  seed: 42
  seeds_final: [42, 43, 44]
  timezone: Asia/Kolkata

data:
  study_period:
    start: '2021-01'
    end: '2025-12'
  min_days_per_month: 10
  core_cohort_min_coverage: 0.70  # 70% valid monthly targets in 2021-2023
  core_cohort_period:
    start: '2021-01'
    end: '2023-12'

features:
  idw:
    max_stations: 5
    power: 2
  trailing_rain_months: [3, 6]
  lookback: [6, 12]
  horizon: [1, 3, 6]  # primary h=1; secondary h=3,6
  missing_input:
    carry_forward_months: 1

spatial_split:
  cell_size_m: 25000
  crs: EPSG:32643
  seed: 42
  test_frac: 0.20
  val_frac: 0.16
  train_frac: 0.64

temporal_split:
  initial_fit:
    start: '2021-01'
    end: '2023-12'
  validation:
    start: '2024-01'
    end: '2024-06'
  refit:
    start: '2021-01'
    end: '2024-06'
  calibration:
    start: '2024-07'
    end: '2024-12'
  test:
    start: '2025-01'
    end: '2025-12'
  rolling_origin:
    - fit_end: '2022-12'
      val_start: '2023-01'
      val_end: '2023-06'
    - fit_end: '2023-06'
      val_start: '2023-07'
      val_end: '2023-12'

model:
  gru_hidden: 64
  gat_heads: 2
  gat_layers: 2
  mlp_hidden: 32
  dropout: 0.1
  variance_floor: 1.0e-4

graph:
  k_neighbours: 5
  self_loop: true
  # ell computed from data: median positive training-graph neighbour distance

training:
  optimizer: adam
  lr: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 1.0
  batch_size: 4  # 4 monthly graph snapshots
  max_epochs: 200
  patience: 20
  pseudo_query_frac: 0.20

tuning:
  n_configs: 12
  search_space:
    gru_hidden: [32, 64]
    lookback: [6, 12]
    k_neighbours: [3, 5, 10]
    gat_heads: [2, 4]
    dropout: [0.1, 0.3]
    lr: [1.0e-3, 3.0e-4]

teacher:
  gru_hidden: 128
  gat_heads: 4
  oof_k_folds: 5
  oof_seed: 42

distillation:
  alpha: [0.0, 0.3, 0.5, 0.7]
  warmup_epochs: 0  # optional linear warmup

imputation:
  n_samples: 20
  internal_mask_frac: 0.10

calibration:
  nominal_coverage: 0.90

metrics:
  nse_min_targets: 6
